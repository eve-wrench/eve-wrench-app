[workspace]
resolver = "3"
members = ["crates/eve-wrench-core", "crates/eve-wrench"]

[workspace.package]
version = "0.4.0-preview.1"
edition = "2024"
authors = ["Tim Kunze"]
repository = "https://github.com/eve-wrench/eve-wrench-app"

[workspace.dependencies]
eve-wrench-core = { path = "crates/eve-wrench-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# GPUI is far too slow unoptimized; optimize dependencies in dev builds while
# keeping the workspace crates quick to rebuild.
[profile.dev.package."*"]
opt-level = 3
