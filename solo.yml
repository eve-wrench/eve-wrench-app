name: EVE Wrench
processes:
    Run app:
        command: cargo run -p eve-wrench
        auto_start: false
    Cargo check:
        command: cargo check --workspace
        auto_start: false
    Cargo clippy:
        command: cargo clippy --workspace --all-targets
        auto_start: false
    Test:
        command: cargo test --workspace
        auto_start: false
    Format:
        command: cargo fmt --all
        auto_start: false
    Package:
        command: cargo packager --release -p eve-wrench
        auto_start: false
