name: CI

on:
    push:
        branches: [main, release]
    pull_request:
        branches: [main, release]

# Cancel superseded runs on the same ref
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    rust:
        name: Linux
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y clang libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan1

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - name: Rust cache
              uses: swatinem/rust-cache@v2

            - name: Format
              run: cargo fmt --all -- --check

            - name: Clippy
              run: cargo clippy --workspace --all-targets -- -D warnings

            - name: Test
              run: cargo test --workspace

    # GPUI renders natively per OS, so each platform compiles different code
    platforms:
        name: ${{ matrix.name }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: macOS
                      os: macos-latest
                    - name: Windows
                      os: windows-latest
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy

            - name: Rust cache
              uses: swatinem/rust-cache@v2

            - name: Clippy
              run: cargo clippy --workspace --all-targets -- -D warnings

            - name: Test
              run: cargo test --workspace
