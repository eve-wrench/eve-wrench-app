name: "Release"

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  # Build the "What's Changed" notes from conventional commits since the last
  # release tag, and hand them to the release job.
  changelog:
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --strip header

      - name: Prepare notes output
        id: notes
        shell: bash
        env:
          CONTENT: ${{ steps.cliff.outputs.content }}
        run: |
          notes="## What's Changed"$'\n\n'"$CONTENT"
          # Fall back to a placeholder if there were no notable commits
          if [ -z "$(printf '%s' "$CONTENT" | tr -d '[:space:]')" ]; then
            notes="See the assets below to download and install EVE Wrench."
          fi
          {
            echo 'notes<<CHANGELOG_EOF'
            echo "$notes"
            echo CHANGELOG_EOF
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: changelog
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            updater: "macos-aarch64"
          - platform: "macos-latest"
            target: "x86_64-apple-darwin"
            updater: "macos-x86_64"
          - platform: "ubuntu-24.04"
            target: "x86_64-unknown-linux-gnu"
            updater: "linux-x86_64"
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            updater: "windows-x86_64"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan1 libfuse2t64

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name'] == 'eve-wrench'))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A hyphenated semver (e.g. 0.3.0-preview.1) marks a pre-release, so the
          # GitHub release is flagged accordingly and stable users aren't notified.
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      # The target env makes the packager's own `cargo build` hook build for it too
      # Auto-updates are enabled once the repository has the UPDATER_PUBKEY
      # variable and the UPDATER_PRIVATE_KEY (+ _PASSWORD) secrets; the public
      # key is compiled into the app and every package gets a .sig file.
      - name: Package
        shell: bash
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          # The AppImage tooling is itself an AppImage; runners have no FUSE mount
          APPIMAGE_EXTRACT_AND_RUN: "1"
          EVE_WRENCH_UPDATER_PUBKEY: ${{ vars.UPDATER_PUBKEY }}
          SIGNING_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.UPDATER_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$EVE_WRENCH_UPDATER_PUBKEY" ] && [ -n "$SIGNING_KEY" ]; then
            export CARGO_PACKAGER_SIGN_PRIVATE_KEY="$SIGNING_KEY"
            export CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD="$SIGNING_KEY_PASSWORD"
          fi
          # Relative paths resolve against the crate, so point at the repo root
          cargo packager --release -p eve-wrench --target ${{ matrix.target }} --out-dir "$GITHUB_WORKSPACE/dist"

      - name: Create draft release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ needs.changelog.outputs.notes }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            flags=(--draft --title "EVE Wrench $tag" --notes "$NOTES")
            if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); fi
            gh release create "$tag" "${flags[@]}" || gh release view "$tag" > /dev/null
          fi

      - name: Upload packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          shopt -s nullglob
          files=(dist/*.dmg dist/*.exe dist/*.msi dist/*.deb dist/*.AppImage)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No packages found in dist"
            ls -la dist
            exit 1
          fi
          for file in "${files[@]}"; do
            # GitHub rewrites spaces in asset names, which would break the
            # download URLs recorded in latest.json
            case "$file" in
              *.dmg) name="EVE-Wrench_${{ steps.version.outputs.version }}_${{ matrix.target }}.dmg" ;;
              *) name=$(basename "$file" | tr ' ' '-') ;;
            esac
            cp "$file" "$name"
            gh release upload "$tag" "$name" --clobber
          done

      # The binary has no runtime dependencies (no WebView2), so ship it as a
      # no-install portable build alongside the installers.
      - name: Upload portable Windows executable
        if: startsWith(matrix.platform, 'windows')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dest="EVE-Wrench_${{ steps.version.outputs.version }}_x64-portable.exe"
          cp "target/${{ matrix.target }}/release/eve-wrench.exe" "$dest"
          gh release upload "v${{ steps.version.outputs.version }}" "$dest" --clobber

      - name: Upload update bundle
        if: ${{ vars.UPDATER_PUBKEY != '' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="v$version"
          shopt -s nullglob
          bundle=""
          case "${{ matrix.updater }}" in
            macos-*)
              bundle="dist/EVE Wrench.app.tar.gz"
              format=app
              name="EVE-Wrench_${version}_${{ matrix.target }}.app.tar.gz"
              cp "$bundle" "$name"
              gh release upload "$tag" "$name" --clobber
              ;;
            linux-*)
              bundle=$(find dist -maxdepth 1 -name '*.AppImage' | head -1)
              format=appimage
              name=$(basename "$bundle" | tr ' ' '-')
              ;;
            windows-*)
              bundle=$(find dist -maxdepth 1 -name '*.exe' | head -1)
              format=nsis
              name=$(basename "$bundle" | tr ' ' '-')
              ;;
          esac
          if [ ! -f "$bundle" ] || [ ! -f "$bundle.sig" ]; then
            echo "::error::Signed update bundle not found for ${{ matrix.updater }}"
            ls -la dist
            exit 1
          fi
          python - "$bundle.sig" "$name" "$format" > "updater-${{ matrix.updater }}.json" <<'PY'
          import json, sys, urllib.parse
          sig_path, name, fmt = sys.argv[1:]
          url = "https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/" + urllib.parse.quote(name)
          print(json.dumps({"signature": open(sig_path).read().strip(), "url": url, "format": fmt}))
          PY

      - name: Keep update bundle details
        if: ${{ vars.UPDATER_PUBKEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.updater }}
          path: updater-${{ matrix.updater }}.json

  # Combines every platform's signed bundle into the manifest the app polls
  # (releases/latest/download/latest.json).
  updater-manifest:
    needs: [changelog, publish]
    if: ${{ vars.UPDATER_PUBKEY != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          merge-multiple: true
          path: updater

      - name: Publish latest.json
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ needs.changelog.outputs.notes }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name'] == 'eve-wrench'))")
          python3 - "$version" > latest.json <<'PY'
          import datetime, glob, json, os, sys
          platforms = {}
          for path in glob.glob("updater/updater-*.json"):
              key = os.path.basename(path)[len("updater-"):-len(".json")]
              platforms[key] = json.load(open(path))
          print(json.dumps({
              "version": sys.argv[1],
              "notes": os.environ.get("NOTES", ""),
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }, indent=2))
          PY
          gh release upload "v$version" latest.json --clobber
