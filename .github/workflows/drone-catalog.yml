name: Drone catalog

# Regenerates the drone group presets when CCP publishes a new SDE build and
# opens a pull request with them. Installed apps fetch the file from main, so a
# merged catalog reaches users without a release.
on:
    schedule:
        # The SDE is published after downtime (11:00 UTC)
        - cron: "30 12 * * *"
    workflow_dispatch:

concurrency:
    group: drone-catalog
    cancel-in-progress: false

permissions:
    contents: write
    pull-requests: write

jobs:
    update:
        name: Update
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4

            - name: Compare SDE builds
              id: sde
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  latest=$(curl -sf https://developers.eveonline.com/static-data/tranquility/latest.jsonl | jq -r 'select(._key == "sde") | .buildNumber')
                  current=$(jq -r .sde_build crates/eve-wrench-core/data/drone_groups.json)
                  echo "SDE build $latest, catalog built from $current"
                  branch="drone-catalog/sde-$latest"
                  echo "latest=$latest" >> "$GITHUB_OUTPUT"
                  echo "branch=$branch" >> "$GITHUB_OUTPUT"
                  # A pull request for this build is already open. The branch alone
                  # is not enough, since a run can push it and then fail.
                  if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
                      echo "Pull request for $branch already open"
                  elif [ -n "$latest" ] && [ "$latest" != "$current" ]; then
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

            # A build whose drones match the catalog gets no pull request, so
            # remember it was checked instead of regenerating it every day
            - name: Restore checked build
              if: steps.sde.outputs.changed == 'true'
              id: checked
              uses: actions/cache/restore@v4
              with:
                  path: .sde-checked
                  key: drone-catalog-checked-${{ steps.sde.outputs.latest }}

            # rustup installs the nightly pinned in the tool's rust-toolchain.toml
            - name: Rust cache
              if: steps.sde.outputs.changed == 'true' && steps.checked.outputs.cache-hit != 'true'
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: tools/drone-catalog

            - name: Generate catalog
              if: steps.sde.outputs.changed == 'true' && steps.checked.outputs.cache-hit != 'true'
              id: generate
              working-directory: tools/drone-catalog
              run: |
                  file=../../crates/eve-wrench-core/data/drone_groups.json
                  git show HEAD:crates/eve-wrench-core/data/drone_groups.json > /tmp/old.json
                  cargo run --release
                  # The build number alone changes with every SDE release
                  if [ "$(jq -S 'del(.sde_build)' /tmp/old.json)" = "$(jq -S 'del(.sde_build)' "$file")" ]; then
                      echo "Drones unchanged in build ${{ steps.sde.outputs.latest }}"
                  else
                      echo "drones=true" >> "$GITHUB_OUTPUT"
                  fi
                  echo "${{ steps.sde.outputs.latest }}" > ../../.sde-checked

            - name: Save checked build
              if: steps.generate.outcome == 'success' && steps.generate.outputs.drones != 'true'
              uses: actions/cache/save@v4
              with:
                  path: .sde-checked
                  key: drone-catalog-checked-${{ steps.sde.outputs.latest }}

            - name: Open pull request
              if: steps.generate.outputs.drones == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  BRANCH: ${{ steps.sde.outputs.branch }}
                  BUILD: ${{ steps.sde.outputs.latest }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git switch -c "$BRANCH"
                  git add crates/eve-wrench-core/data/drone_groups.json
                  title="chore(drones): update drone catalog to SDE build $BUILD"
                  git commit -m "$title"
                  git push --force -u origin "$BRANCH"
                  url=$(gh pr create --base main --head "$BRANCH" --title "$title" \
                      --body "Regenerated from SDE build $BUILD. Apps pick it up from main once merged.")
                  # Older catalog pull requests are superseded by this one
                  gh pr list --state open --json number,headRefName \
                      --jq ".[] | select(.headRefName | startswith(\"drone-catalog/\")) | select(.headRefName != \"$BRANCH\") | .number" |
                      while read -r number; do
                          gh pr close "$number" --delete-branch --comment "Superseded by $url"
                      done
