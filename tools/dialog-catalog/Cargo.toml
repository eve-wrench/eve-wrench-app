# Kept out of the workspace like drone-catalog, so its dependencies stay out of the app.
[package]
name = "dialog-catalog"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde-pickle = "1"
serde_json = "1"
ureq = { version = "3", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
